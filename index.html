<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phillap — Your life, in one place</title>
<style>
:root{color-scheme:dark;--bg:#101522;--panel:#191f2d;--panel2:#20283a;--line:#303a4e;--text:#eff2f8;--muted:#a3adbf;--accent:#9db7ff;--green:#a3e4bf;--pink:#f1b3ca;--gold:#edcf8c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,"Segoe UI",sans-serif}body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(180deg,rgba(10,17,24,.34),rgba(12,19,25,.54) 62%,rgba(12,17,24,.78)),url("/forest-temple.svg");background-size:cover;background-position:center 42%;transition:filter .6s ease,opacity .6s ease}body[data-theme="moonlit"]::before{filter:hue-rotate(40deg) saturate(.75) brightness(.76)}body[data-theme="golden"]::before{filter:hue-rotate(-18deg) saturate(1.12) brightness(1.06)}body[data-theme="moss"]::before{filter:hue-rotate(-27deg) saturate(.84) brightness(.87)}body[data-theme="stone"]::before{filter:grayscale(.78) sepia(.2) brightness(.82)}.shell{position:relative;z-index:1}button,input,textarea,select{font:inherit;color:inherit;background:#111827;border:1px solid var(--line);border-radius:10px;padding:10px}button{cursor:pointer}button:hover{border-color:var(--accent)}.shell{min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr)}aside{padding:22px 14px;background:rgba(18,25,35,.87);backdrop-filter:blur(16px);border-right:1px solid var(--line)}.brand{padding:4px 10px 24px}.brand b{font-size:22px}.brand small{display:block;color:var(--muted)}nav{display:grid;gap:6px}nav button{background:transparent;border-color:transparent;text-align:left;padding:11px 12px;color:var(--muted)}nav button.active{background:color-mix(in srgb,var(--area-accent) 15%,#242f43);color:var(--text);border-color:var(--area-accent)}body[data-area="home"]{--area-accent:#9db7ff}body[data-area="thoughts"]{--area-accent:#b8a1ff}body[data-area="dreams"]{--area-accent:#a7a9ff}body[data-area="todos"]{--area-accent:#a3e4bf}body[data-area="finances"]{--area-accent:#edcf8c}body[data-area="journal"]{--area-accent:#f1b3ca}body[data-area="files"]{--area-accent:#8edbd2}body[data-area="computer"]{--area-accent:#ffb784}.brand b{color:var(--area-accent)}.card h2{color:color-mix(in srgb,var(--area-accent) 82%,white)}.primary{border-color:var(--area-accent)}.local-note{margin:24px 10px;color:var(--muted);font-size:12px}.main{min-width:0;padding:28px;max-width:1200px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.top-controls{display:grid;justify-items:end;gap:5px}.theme-picker{width:auto;min-width:172px;padding:7px 10px;font-size:13px;background:rgba(17,24,39,.88)}.top h1{font-size:28px;margin:0}.top p{margin:3px 0;color:var(--muted)}.date{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:rgba(25,31,45,.91);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}.card h2{font-size:17px;margin:0 0 12px}.wide{grid-column:1/-1}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:13px;color:var(--muted)}input,textarea,select{width:100%}textarea{min-height:110px;resize:vertical}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.primary{background:#394e77;border-color:#536d9d}.soft{background:var(--panel2)}.status{color:var(--muted);font-size:13px;min-height:21px;margin:8px 0}.error{color:#ffb4ab}.good{color:var(--green)}.entry-list{display:grid;gap:9px}.entry{padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(21,28,41,.94)}.entry-top{display:flex;align-items:flex-start;gap:10px}.entry-top input[type=checkbox]{width:auto;margin:4px 0 0}.entry-text{flex:1;min-width:0}.entry-title{font-weight:600;overflow-wrap:anywhere}.entry.done .entry-title{text-decoration:line-through;color:var(--muted)}.entry-body{white-space:pre-wrap;overflow-wrap:anywhere;color:#d2d9e5;margin-top:5px}.entry-meta{color:var(--muted);font-size:12px;margin-top:5px}.entry button{font-size:12px;padding:5px 8px}.empty{color:var(--muted);padding:16px 6px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{border-radius:99px;background:#252f43;padding:7px 11px;color:#d6def0;font-size:13px}.welcome{font-size:16px;color:#dbe4f6}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{text-align:left;background:var(--panel2)}.quick strong{display:block;margin-bottom:2px}.quick small{color:var(--muted)}.privacy{border-left:3px solid var(--green);padding:10px 12px;background:#17251f;border-radius:4px 10px 10px 4px;color:#cfe9d9;font-size:13px}.drop-zone{border:1px dashed #62718d;border-radius:14px;padding:20px;text-align:center;background:rgba(21,28,41,.9)}.drop-zone.drag{border-color:var(--accent);background:#202a3d}.file-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line)}.file-row:last-child{border-bottom:0}.file-name{overflow-wrap:anywhere;font-weight:600}.file-meta{color:var(--muted);font-size:12px}.file-actions{display:flex;gap:6px;flex-shrink:0}.file-editor textarea{min-height:280px;font-family:ui-monospace,Consolas,monospace;font-size:13px}.money-summary{font-size:25px;color:var(--gold);font-weight:700}.hidden{display:none!important}@media(max-width:760px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:12px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:8px 10px}.brand{padding:4px 8px 12px}.local-note{display:none}.main{padding:18px 13px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.quick{grid-template-columns:1fr}.top h1{font-size:24px}}
</style></head>
<body><div class="shell"><aside><div class="brand"><b>Phillap</b><small>Your personal life assistant</small></div><nav id="nav" aria-label="Life areas"></nav><div class="local-note">Your entries are stored in a local database on this PC.</div></aside>
<main class="main"><div class="top"><div><h1 id="page-title">Home</h1><p id="page-subtitle">A calmer place to gather what’s on your mind.</p></div><div class="top-controls"><div class="date" id="today"></div><label class="date" for="theme-select">Background theme</label><select id="theme-select" class="theme-picker" aria-label="Background theme"><option value="forest">Forest temple</option><option value="moonlit">Moonlit grove</option><option value="golden">Golden canopy</option><option value="moss">Moss sanctuary</option><option value="stone">Quiet stone</option></select></div></div><div id="page"></div></main></div>
<script>
const areas={home:{title:'Home',sub:'A calmer place to gather what’s on your mind.'},thoughts:{title:'Thoughts',sub:'Capture loose thoughts before they disappear.'},dreams:{title:'Dreams',sub:'Save the dreams you remember, without needing to interpret them.'},todos:{title:'To-dos',sub:'Small next steps, all in one place.'},finances:{title:'Finances',sub:'Keep simple notes on money in and money out.'},journal:{title:'Journal',sub:'A private space for the day, in your own words.'},files:{title:'Files',sub:'Keep useful documents together for your local assistant.'},assistant:{title:'Assistant',sub:'Ask your local model about files you have chosen.'},computer:{title:'Computer',sub:'Choose an action. Phillap asks before opening, downloading, or copying files.'}};let current=new URLSearchParams(location.search).get('area')||'home';if(!areas[current])current='home';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}
function renderNav(){const nav=$('nav');nav.replaceChildren();for(const [key,a]of Object.entries(areas)){const b=document.createElement('button');b.textContent=a.title;b.className=key===current?'active':'';b.onclick=()=>show(key);nav.append(b)}}
function show(key){current=key;history.replaceState(null,'','?area='+encodeURIComponent(key));document.body.dataset.area=key;$('page-title').textContent=areas[key].title;$('page-subtitle').textContent=areas[key].sub;renderNav();renderPage()}
function entryCard(x){const checked=x.completed?'checked':'';const done=x.completed?' done':'';const amount=x.amount!=null?`<div class="entry-meta">$${Number(x.amount).toFixed(2)}</div>`:'';const due=x.due_date?`<div class="entry-meta">Due ${esc(x.due_date)}</div>`:'';return `<article class="entry${done}"><div class="entry-top"><input aria-label="Mark ${esc(x.title)} complete" type="checkbox" ${checked} onchange="toggleEntry(${x.id},this.checked)"><div class="entry-text"><div class="entry-title">${esc(x.title)}</div>${x.content?`<div class="entry-body">${esc(x.content)}</div>`:''}${amount}${due}</div><button class="soft" onclick="removeEntry(${x.id})" aria-label="Delete ${esc(x.title)}">Delete</button></div></article>`}
function entryForm(area){const todo=area==='todos';const finance=area==='finances';return `<form class="card" id="entry-form"><h2>${todo?'Add a to-do':finance?'Add a money note':area==='dreams'?'Record a dream':area==='journal'?'Write a journal entry':'Capture a thought'}</h2><div class="field"><label for="entry-title">${todo?'What needs doing?':'Title'}</label><input id="entry-title" maxlength="160" required placeholder="${todo?'A small next step':'A few words to find this later'}"></div><div class="field"><label for="entry-content">${finance?'Note or category':'Details'}</label><textarea id="entry-content" maxlength="12000" placeholder="Write freely. This saves only on this device."></textarea></div>${todo?'<div class="field"><label for="entry-due">Due date (optional)</label><input type="date" id="entry-due"></div>':''}${finance?'<div class="field"><label for="entry-amount">Amount in dollars (optional)</label><input type="number" id="entry-amount" step="0.01" min="-999999999" max="999999999" placeholder="0.00"></div><div class="status">This is a private note tracker, not a bank connection or financial advice.</div>':''}<button class="primary" type="submit">Save ${todo?'to-do':finance?'note':'entry'}</button><div class="status" id="form-status" aria-live="polite"></div></form>`}
async function renderEntries(area,target){try{const items=await api('/api/entries/'+area);const box=$(target);box.innerHTML=items.length?items.map(entryCard).join(''):'<div class="empty">Nothing here yet. Add an entry when you’re ready.</div>';if(area==='todos'){const open=items.filter(x=>!x.completed).length;$('todo-count').textContent=open?`${open} open`:'All caught up'}}catch(e){$(target).textContent=e.message;$(target).className='status error'}}
function filePanel(){return `<section class="card wide"><div class="row"><div><h2>Your files</h2><p class="status">Files stay on this PC. Supported: PDF, Word (.docx), text, Markdown, CSV, and code/config files. Up to 10 MB each.</p></div><button class="soft" onclick="show('files')">Open library</button></div><div class="drop-zone" id="drop-zone"><strong>Drop files here</strong><br><span class="status">or choose files from this PC</span><br><button type="button" class="primary" id="choose-files">Add files</button><input class="hidden" id="file-input" type="file" multiple accept=".pdf,.docx,.md,.txt,.rst,.py,.js,.ts,.tsx,.json,.yaml,.yml,.toml,.html,.css,.csv,.xml,.ini"></div><div id="file-status" class="status" aria-live="polite"></div><div class="entry-list" id="file-list"></div><section id="file-editor" class="file-editor hidden" style="margin-top:18px"><h2 id="edit-title">Edit a copy</h2><p class="status">Saving creates a new local file. The original stays unchanged.</p><textarea id="edit-content" aria-label="Edited copy contents"></textarea><div class="row" style="margin-top:8px"><button type="button" class="primary" id="save-edited">Save separate copy</button><button type="button" class="soft" id="cancel-edit">Cancel</button></div><div id="edit-status" class="status" aria-live="polite"></div></section></section>`}
function bindFilePicker(){const picker=$('file-input'),drop=$('drop-zone');if(!picker||!drop)return;$('choose-files').onclick=()=>picker.click();picker.onchange=()=>{uploadFiles([...picker.files]);picker.value=''};for(const event of ['dragenter','dragover'])drop.addEventListener(event,e=>{e.preventDefault();drop.classList.add('drag')});for(const event of ['dragleave','drop'])drop.addEventListener(event,e=>{e.preventDefault();drop.classList.remove('drag')});drop.addEventListener('drop',e=>uploadFiles([...e.dataTransfer.files]))}
async function uploadFiles(files){if(!files.length)return;for(const file of files){if(file.size>10*1024*1024){status('file-status',file.name+' is over the 10 MB limit.','error');continue}status('file-status','Adding '+file.name+'…');try{const content=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=()=>reject(Error('Could not read '+file.name));reader.readAsDataURL(file)});await api('/api/files',{name:file.name,content});status('file-status',file.name+' added. It stays on this PC.','good');await renderFileList()}catch(e){status('file-status',e.message,'error')}}}
async function renderFileList(){try{const files=await api('/api/files'),box=$('file-list');if(!box)return;box.replaceChildren();if(!files.length){box.innerHTML='<div class="empty">No files yet. Add something you want to keep handy.</div>';return}for(const file of files){const row=document.createElement('div');row.className='file-row';const info=document.createElement('div');const name=document.createElement('div');name.className='file-name';name.textContent=file.name;const meta=document.createElement('div');meta.className='file-meta';meta.textContent=(file.size/1024).toFixed(0)+' KB · '+(file.supported?'available to document search':'stored locally; not searchable');info.append(name,meta);const actions=document.createElement('div');actions.className='file-actions';const download=document.createElement('a');download.className='soft';download.href='/api/files/'+encodeURIComponent(file.id)+'/download';download.download=file.name;download.textContent='Download';download.style.textDecoration='none';download.style.padding='5px 8px';download.style.border='1px solid var(--line)';download.style.borderRadius='8px';actions.append(download);if(file.supported){const edit=document.createElement('button');edit.className='soft';edit.textContent='Edit copy';edit.onclick=()=>editUploadedFile(file.id);actions.append(edit)}const del=document.createElement('button');del.className='soft';del.textContent='Remove';del.onclick=()=>deleteFile(file.id,file.name);actions.append(del);row.append(info,actions);box.append(row)}}catch(e){status('file-status',e.message,'error')}}
async function editUploadedFile(id){try{const source=await api('/api/files/'+id+'/content');$('edit-title').textContent='Edit a copy of '+source.name;$('edit-content').value=source.content;$('file-editor').classList.remove('hidden');$('edit-status').textContent=source.format==='.pdf'||source.format==='.docx'?'Saving creates an editable Markdown text copy; download it and open it in your synced folder if needed. The original is untouched.':'Saving creates another file copy. Download the copy to put it in a synced folder; the uploaded original is untouched.';$('save-edited').onclick=async()=>{if(!confirm('Save your edited text as a separate new file? The source file will not be changed.'))return;$('save-edited').disabled=true;try{const copy=await api('/api/files/edit',{id,content:$('edit-content').value});$('edit-status').textContent='Saved '+copy.name+' as a separate copy. The original is unchanged.';$('edit-status').className='status good';await renderFileList()}catch(e){$('edit-status').textContent=e.message;$('edit-status').className='status error'}finally{$('save-edited').disabled=false}};$('cancel-edit').onclick=()=>{$('file-editor').classList.add('hidden');$('edit-content').value=''};$('file-editor').scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){status('file-status',e.message,'error')}}
async function deleteFile(id,name){if(!confirm('Remove '+name+' from Phillap on this PC?'))return;try{await api('/api/files/delete',{id});status('file-status',name+' removed.','good');await renderFileList()}catch(e){status('file-status',e.message,'error')}}
function assistantPage(){return `<section class="card"><h2>Ask Phillap</h2><div class="privacy">Answers run through Ollama on this PC. Phillap searches the files you upload and the documents folder you configured. It does not automatically send your private To-do, Dream, Finance, Thought, or Journal entries to the model.</div><div id="messages" class="messages" style="height:48vh;min-height:250px;margin:14px 0"></div><div class="row"><textarea id="question" placeholder="Ask about a document…" aria-label="Message"></textarea><button class="primary" id="send">Ask</button></div><div id="chat-status" class="status" aria-live="polite">Your local model is ready when Ollama is running.</div></section>`}
function bindAssistant(){const send=$('send');if(!send)return;let history=[];const submit=async()=>{const question=$('question').value.trim();if(!question)return;addMessage('user',question);$('question').value='';history.push({role:'user',content:question});send.disabled=true;status('chat-status','Thinking on this PC…');try{const answer=await api('/api/chat',{question,history:history.slice(0,-1)});history.push({role:'assistant',content:answer.answer});addMessage('assistant',answer.answer,answer.sources);status('chat-status','Ready.')}catch(e){status('chat-status',e.message,'error')}finally{send.disabled=false;$('question').focus()}};send.onclick=submit;$('question').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}})}
function computerPage(){return `<div class="grid"><section class="card wide"><h2>Open a file or app</h2><p class="status">Type a full Windows path. Phillap will ask you to confirm the exact path before opening it.</p><div class="field"><label for="open-path">File or application path</label><div class="row"><input id="open-path" placeholder="C:\\Users\\you\\Documents\\notes.txt"><button type="button" class="soft" id="browse-file">Browse…</button></div></div><button class="primary" id="open-action">Review and open</button><div class="status" id="open-status" aria-live="polite"></div></section><section class="card"><h2>Download a file</h2><p class="status">Downloads use HTTPS, are limited to 50 MB, and save in your Downloads\Phillap folder. Redirects and local-network addresses are blocked.</p><div class="field"><label for="download-url">Direct HTTPS download link</label><input id="download-url" type="url" placeholder="https://example.com/file.pdf"></div><button class="primary" id="download-action">Review and download</button><div class="status" id="download-status" aria-live="polite"></div></section><section class="card"><h2>Organize copies of files</h2><p class="status">Choose a folder path. Phillap previews a plan, then copies files into “Phillap Organized” subfolders. Originals are never moved or deleted.</p><div class="field"><label for="organize-path">Folder path</label><div class="row"><input id="organize-path" placeholder="C:\\Users\\you\\Downloads"><button type="button" class="soft" id="browse-folder">Browse…</button></div></div><button class="primary" id="plan-action">Preview copy plan</button><div id="plan-status" class="status" aria-live="polite"></div><div id="plan-list" class="entry-list"></div><button class="soft hidden" id="apply-plan">Confirm and copy these files</button></section><section class="card"><h2>Safety boundaries</h2><div class="privacy">Phillap does not run arbitrary shell commands or follow AI instructions to operate Windows. You choose each path and approve each action. Keep sensitive files out of folders you choose to upload or organize.</div></section></div>`}
function bindComputer(){const opener=$('open-action');if(!opener)return;$('browse-file').onclick=async()=>{try{const chosen=await api('/api/computer/pick-file',{});if(chosen.path)$('open-path').value=chosen.path}catch(e){status('open-status',e.message,'error')}};$('browse-folder').onclick=async()=>{try{const chosen=await api('/api/computer/pick-folder',{});if(chosen.path)$('organize-path').value=chosen.path}catch(e){status('plan-status',e.message,'error')}};opener.onclick=async()=>{const path=$('open-path').value.trim();if(!path)return status('open-status','Enter a file or application path.','error');if(!confirm(`Open this exact item on your computer?\n\n${path}`))return;try{const result=await api('/api/computer/open',{path});status('open-status','Opened '+result.opened,'good')}catch(e){status('open-status',e.message,'error')}};$('download-action').onclick=async()=>{const url=$('download-url').value.trim();if(!url)return status('download-status','Enter a direct HTTPS download link.','error');if(!confirm(`Download this file to your Downloads\\Phillap folder?\n\n${url}\n\nOnly download files from a source you trust.`))return;status('download-status','Downloading…');try{const result=await api('/api/computer/download',{url});status('download-status',`Saved ${result.name} to ${result.path} (${(result.size/1024).toFixed(0)} KB).`,'good')}catch(e){status('download-status',e.message,'error')}};$('plan-action').onclick=async()=>{const folder=$('organize-path').value.trim();if(!folder)return status('plan-status','Enter a folder path first.','error');try{const plan=await api('/api/computer/organize-preview',{folder}),list=$('plan-list');list.replaceChildren();$('apply-plan').classList.add('hidden');if(!plan.files.length){status('plan-status','No new files to copy. The originals are unchanged.','good');return}for(const item of plan.files){const row=document.createElement('div');row.className='file-row';const label=document.createElement('div');label.textContent=`${item.name} → ${item.category}`;row.append(label);list.append(row)}status('plan-status',`${plan.files.length} files will be copied to ${plan.output}. Original files will stay untouched.`);$('apply-plan').classList.remove('hidden');$('apply-plan').onclick=async()=>{if(!confirm(`Copy ${plan.files.length} files into:\n${plan.output}?\n\nNo originals will be moved or deleted.`))return;$('apply-plan').disabled=true;try{const result=await api('/api/computer/organize',{folder,files:plan.files});status('plan-status',`Copied ${result.copied} files into ${result.output}. Originals are unchanged.`,'good');$('apply-plan').classList.add('hidden');list.replaceChildren()}catch(e){status('plan-status',e.message,'error')}finally{$('apply-plan').disabled=false}}}catch(e){status('plan-status',e.message,'error')}}}
function summaryCard(area,title,target){return `<section class="card"><div class="row"><h2>${title}</h2>${area==='todos'?'<span id="todo-count" class="status"></span>':''}<button class="soft" onclick="show('${area}')">Open</button></div><div class="entry-list" id="${target}"></div></section>`}
async function renderHome(){ $('page').innerHTML=`<div class="grid"><section class="card wide"><p class="welcome">You don’t need to organize everything right now. Put one thing somewhere safe and come back when you want.</p><div class="quick"><button onclick="show('todos')"><strong>To-dos</strong><small>Pick one next step</small></button><button onclick="show('thoughts')"><strong>Thoughts</strong><small>Clear some headspace</small></button><button onclick="show('journal')"><strong>Journal</strong><small>Write a little about today</small></button><button onclick="show('assistant')"><strong>Ask Phillap</strong><small>Ask about selected files</small></button></div></section>${summaryCard('todos','Next to-dos','home-todos')}${summaryCard('thoughts','Recent thoughts','home-thoughts')}${filePanel()}<section class="card"><h2>Dreams</h2><p class="status">Keep a record of what you remember. No interpretation required.</p><button onclick="show('dreams')">Open dreams</button></section><section class="card"><h2>Finances</h2><p class="status">A simple private note log. No bank accounts connected.</p><button onclick="show('finances')">Open finances</button></section><section class="card wide"><div class="privacy">Private by default: your thoughts, dreams, finances, journal, and tasks stay in a local SQLite file on this PC. They are not sent to GitHub or Ollama.</div></section><section class="card wide"><h2>Use your computer</h2><p class="status">Open a file, download a trusted link, or preview safe copies into folders.</p><button class="primary" onclick="show('computer')">Open computer tools</button></section></div>`;await renderEntries('todos','home-todos');await renderEntries('thoughts','home-thoughts');bindFilePicker();await renderFileList()}
async function renderPage(){if(current==='home'){await renderHome();return}if(current==='computer'){$('page').innerHTML=computerPage();bindComputer();return}if(current==='assistant'){$('page').innerHTML=assistantPage();bindAssistant();return}if(current==='files'){$('page').innerHTML=`<div class="grid">${filePanel()}<section class="card wide"><h2>How file search works</h2><div class="privacy">Uploaded files stay in this PC’s Phillap folder. When you ask the local assistant a question, matching text excerpts from supported files are sent to Ollama running on this PC. Scanned-image PDFs need OCR and are not searchable in this version.</div></section></div>`;bindFilePicker();await renderFileList();return}const listId='area-list';$('page').innerHTML=`<div class="grid">${entryForm(current)}<section class="card"><div class="row"><h2>Your ${esc(areas[current].title.toLowerCase())}</h2><button class="soft" id="refresh">Refresh</button></div><div class="entry-list" id="${listId}"></div></section>${current==='finances'?'<section class="card wide"><h2>Gentle reminder</h2><div class="privacy">This is only a personal record keeper. It does not connect to a bank, make budgets, or provide financial advice. Avoid storing account numbers, passwords, or card details.</div></section>':''}</div>`;await renderEntries(current,listId);$('refresh').onclick=()=>renderEntries(current,listId);$('entry-form').onsubmit=async e=>{e.preventDefault();const data={area:current,title:$('entry-title').value,content:$('entry-content').value};if(current==='todos')data.due_date=$('entry-due').value;if(current==='finances')data.amount=$('entry-amount').value;try{await api('/api/entries',data);$('entry-form').reset();const msg=document.querySelector('#form-status');msg.textContent='Saved on this PC.';msg.className='status good';await renderEntries(current,listId)}catch(err){const msg=document.querySelector('#form-status');msg.textContent=err.message;msg.className='status error'}}}
async function toggleEntry(id,completed){try{await api('/api/entries/toggle',{id,completed});await renderPage()}catch(e){alert(e.message)}}async function removeEntry(id){if(!confirm('Delete this entry from this PC?'))return;try{await api('/api/entries/delete',{id});await renderPage()}catch(e){alert(e.message)}}
function addMessage(role,text,sources=[]){const box=document.createElement('div');box.className='message '+role;box.textContent=text;if(sources.length){const note=document.createElement('small');note.textContent='Sources: '+sources.join(', ');box.append(note)}$('messages').append(box);$('messages').scrollTop=$('messages').scrollHeight}
$('today').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(new Date());document.body.dataset.area=current;const themes=['forest','moonlit','golden','moss','stone'];const savedTheme=localStorage.getItem('phillap-theme');const selected=themes.includes(savedTheme)?savedTheme:'forest';document.body.dataset.theme=selected;$('theme-select').value=selected;$('theme-select').onchange=()=>{document.body.dataset.theme=$('theme-select').value;localStorage.setItem('phillap-theme',$('theme-select').value)};renderNav();renderPage();
</script></body></html>
