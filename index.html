<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phillap — Your life, in one place</title>
<style>
:root{color-scheme:dark;--bg:#101522;--panel:#191f2d;--panel2:#20283a;--line:#303a4e;--text:#eff2f8;--muted:#a3adbf;--accent:#9db7ff;--green:#a3e4bf;--pink:#f1b3ca;--gold:#edcf8c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,"Segoe UI",sans-serif}body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(180deg,rgba(10,17,24,.34),rgba(12,19,25,.54) 62%,rgba(12,17,24,.78)),url("/forest-temple.svg");background-size:cover;background-position:center 42%;transition:filter .6s ease,opacity .6s ease}body[data-theme="moonlit"]::before{filter:hue-rotate(40deg) saturate(.75) brightness(.76)}body[data-theme="golden"]::before{filter:hue-rotate(-18deg) saturate(1.12) brightness(1.06)}body[data-theme="moss"]::before{filter:hue-rotate(-27deg) saturate(.84) brightness(.87)}body[data-theme="stone"]::before{filter:grayscale(.78) sepia(.2) brightness(.82)}body[data-font="georgia"]{font-family:Georgia,serif}body[data-font="times"]{font-family:'Times New Roman',serif}body[data-font="palatino"]{font-family:Palatino,'Palatino Linotype',serif}body[data-font="verdana"]{font-family:Verdana,sans-serif}body[data-size="large"]{font-size:18px}body[data-size="xlarge"]{font-size:20px}body[data-contrast="high"]{--bg:#000;--panel:#080808;--panel2:#111;--line:#fff;--text:#fff;--muted:#e6e6e6;--accent:#ffdf00}body[data-contrast="high"] .card,body[data-contrast="high"] .entry,body[data-contrast="high"] aside{background:#000;backdrop-filter:none}body[data-contrast="high"]::before{display:none}body[data-contrast="high"] button,body[data-contrast="high"] input,body[data-contrast="high"] textarea,body[data-contrast="high"] select{background:#000;border-color:#fff}body[data-contrast="high"] .privacy{background:#071c0a;color:#fff}body[data-contrast="high"] *{scroll-behavior:auto!important;animation:none!important;transition:none!important}.shell{position:relative;z-index:1}button,input,textarea,select{font:inherit;color:inherit;background:#111827;border:1px solid var(--line);border-radius:10px;padding:10px}button{cursor:pointer}button:hover{border-color:var(--accent)}.shell{min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr)}aside{padding:22px 14px;background:rgba(18,25,35,.87);backdrop-filter:blur(16px);border-right:1px solid var(--line)}.brand{padding:4px 10px 24px}.brand b{font-size:22px}.brand small{display:block;color:var(--muted)}nav{display:grid;gap:6px}nav button{background:transparent;border-color:transparent;text-align:left;padding:11px 12px;color:var(--muted)}nav button.active{background:color-mix(in srgb,var(--area-accent) 15%,#242f43);color:var(--text);border-color:var(--area-accent)}body[data-area="home"]{--area-accent:#9db7ff}body[data-area="thoughts"]{--area-accent:#b8a1ff}body[data-area="dreams"]{--area-accent:#a7a9ff}body[data-area="todos"]{--area-accent:#a3e4bf}body[data-area="finances"]{--area-accent:#edcf8c}body[data-area="journal"]{--area-accent:#f1b3ca}body[data-area="goals"]{--area-accent:#f0bf75}body[data-area="files"]{--area-accent:#8edbd2}body[data-area="browser"]{--area-accent:#8edbd2}body[data-area="computer"]{--area-accent:#ffb784}.brand b{color:var(--area-accent)}.card h2{color:color-mix(in srgb,var(--area-accent) 82%,white)}.primary{border-color:var(--area-accent)}.local-note{margin:24px 10px;color:var(--muted);font-size:12px}.main{min-width:0;padding:28px;max-width:1200px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.top-controls{display:grid;justify-items:end;gap:5px}.reading-settings{display:grid;justify-items:end;gap:4px}.reading-settings summary{cursor:pointer;color:var(--muted);font-size:13px}.reading-settings:not([open])>*:not(summary){display:none}.theme-picker{width:auto;min-width:172px;padding:7px 10px;font-size:13px;background:rgba(17,24,39,.88)}.top h1{font-size:28px;margin:0}.top p{margin:3px 0;color:var(--muted)}.date{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:rgba(25,31,45,.91);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}.card h2{font-size:17px;margin:0 0 12px}.wide{grid-column:1/-1}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:13px;color:var(--muted)}input,textarea,select{width:100%}textarea{min-height:110px;resize:vertical}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.primary{background:#394e77;border-color:#536d9d}.soft{background:var(--panel2)}.status{color:var(--muted);font-size:13px;min-height:21px;margin:8px 0}.error{color:#ffb4ab}.good{color:var(--green)}.entry-list{display:grid;gap:9px}.entry{padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(21,28,41,.94)}.entry-top{display:flex;align-items:flex-start;gap:10px}.entry-top input[type=checkbox]{width:auto;margin:4px 0 0}.entry-text{flex:1;min-width:0}.entry-title{font-weight:600;overflow-wrap:anywhere}.entry.done .entry-title{text-decoration:line-through;color:var(--muted)}.entry-body{white-space:pre-wrap;overflow-wrap:anywhere;color:#d2d9e5;margin-top:5px}.entry-meta{color:var(--muted);font-size:12px;margin-top:5px}.entry button{font-size:12px;padding:5px 8px}.empty{color:var(--muted);padding:16px 6px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{border-radius:99px;background:#252f43;padding:7px 11px;color:#d6def0;font-size:13px}.welcome{font-size:16px;color:#dbe4f6}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{text-align:left;background:var(--panel2)}.quick strong{display:block;margin-bottom:2px}.quick small{color:var(--muted)}.privacy{border-left:3px solid var(--green);padding:10px 12px;background:#17251f;border-radius:4px 10px 10px 4px;color:#cfe9d9;font-size:13px}.drop-zone{border:1px dashed #62718d;border-radius:14px;padding:20px;text-align:center;background:rgba(21,28,41,.9)}.drop-zone.drag{border-color:var(--accent);background:#202a3d}.file-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line)}.file-row:last-child{border-bottom:0}.file-name{overflow-wrap:anywhere;font-weight:600}.file-meta{color:var(--muted);font-size:12px}.file-actions{display:flex;gap:6px;flex-shrink:0}.file-editor textarea{min-height:280px;font-family:ui-monospace,Consolas,monospace;font-size:13px}.money-summary{font-size:25px;color:var(--gold);font-weight:700}.money-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}.money-tile{border:1px solid var(--line);border-radius:12px;padding:14px;background:rgba(16,22,34,.82)}.money-tile small,.money-tile strong{display:block}.money-tile small{color:var(--muted);font-size:12px}.money-tile strong{font-size:clamp(20px,3vw,30px);margin-top:4px}.money-tile.income strong,.money-value.income{color:#9ce0b4}.money-tile.expense strong,.money-value.expense{color:#ffb4ab}.money-tile.remaining strong{color:#f2d78f}.money-tile.remaining strong.negative{color:#ffb4ab}.money-value{font-size:15px;margin-left:8px}.planner-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.material-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);padding:12px 0}.material-row small{display:block;color:var(--muted);margin:3px 0}.material-price{display:grid;grid-template-columns:100px minmax(140px,1fr) auto;gap:6px;margin-top:7px}.material-price input,.material-form input{padding:7px;font-size:13px}.material-form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 2fr auto;gap:7px;margin:14px 0}.project-card{padding:18px}.project-card h3{margin:20px 0 7px;font-size:15px}.project-card h4{margin:12px 0 6px}.project-total{display:block;text-align:right;font-size:20px;margin:12px 0}.project-step{display:flex;gap:9px;align-items:flex-start;padding:5px 0}.project-step input{width:auto;margin-top:5px}.project-step.done span{text-decoration:line-through;color:var(--muted)}.step-form{margin-top:8px}.step-form input{min-width:0}.nav-add{color:var(--area-accent)!important;border:1px dashed var(--line)!important;margin-top:8px}.custom-delete{color:#ffb4ab}.quick{grid-template-columns:repeat(3,1fr)}.hidden{display:none!important}@media(max-width:760px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:12px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:8px 10px}.brand{padding:4px 8px 12px}.local-note{display:none}.main{padding:18px 13px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.quick{grid-template-columns:1fr}.money-summary-grid{grid-template-columns:1fr}.planner-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.material-form{grid-template-columns:repeat(2,minmax(0,1fr))}.material-price{grid-template-columns:90px minmax(80px,1fr)}.material-price button{grid-column:1/-1}.top h1{font-size:24px}}
</style></head>
<body><div class="shell"><aside><div class="brand"><b>Phillap</b><small>Your personal life assistant</small></div><nav id="nav" aria-label="Life areas"></nav><div class="local-note">Your entries are stored in a local database on this PC.<br><small>Phillap v0.0.2</small></div></aside>
<main class="main"><div class="top"><div><h1 id="page-title">Home</h1><p id="page-subtitle">A calmer place to gather what’s on your mind.</p></div><div class="top-controls"><div class="date" id="today"></div><details class="reading-settings"><summary>Reading &amp; appearance</summary><label class="date" for="theme-select">Background</label><select id="theme-select" class="theme-picker" aria-label="Background theme"><option value="forest">Forest temple</option><option value="moonlit">Moonlit grove</option><option value="golden">Golden canopy</option><option value="moss">Moss sanctuary</option><option value="stone">Quiet stone</option></select><label class="date" for="font-select">Font</label><select id="font-select" class="theme-picker" aria-label="Font"><option value="georgia">Georgia</option><option value="times">Times New Roman</option><option value="palatino">Palatino</option><option value="verdana">Verdana</option><option value="system">System default</option></select><label class="date" for="text-size">Text size</label><select id="text-size" class="theme-picker" aria-label="Text size"><option value="standard">Standard</option><option value="large">Large</option><option value="xlarge">Extra large</option></select><label class="date"><input type="checkbox" id="high-contrast" style="width:auto"> High contrast / less motion</label></details></div></div><div id="app-status" class="status" role="status" aria-live="polite"></div><div id="page"></div></main></div>
<script>
const areas={home:{title:'Home',sub:'A calmer place to gather what’s on your mind.'},thoughts:{title:'Thoughts',sub:'Capture loose thoughts before they disappear.'},dreams:{title:'Dreams',sub:'Save the dreams you remember, without needing to interpret them.'},todos:{title:'To-dos',sub:'Small next steps, all in one place.'},finances:{title:'Money',sub:'See income minus bills. Add the household numbers you know.'},journal:{title:'Journal',sub:'A private space for the day, in your own words.'},projects:{title:'Plans & projects',sub:'Break a goal into practical steps, materials, and estimates.'},goals:{title:'Big goals',sub:'Keep your important goals visible and ordered by priority.'},files:{title:'Files',sub:'Keep useful documents together for your local assistant.'},assistant:{title:'Assistant',sub:'Ask your local model about files you have chosen.'},computer:{title:'Computer',sub:'Choose an action. Phillap asks before opening, downloading, or copying files.'},browser:{title:'Web & AI',sub:'Open websites, AI tools, and Google Voice in your browser.'}};let current=new URLSearchParams(location.search).get('area')||'home';if(!areas[current])current='home';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}
async function renderNav(){const nav=$('nav');nav.replaceChildren();for(const [key,a]of Object.entries(areas)){const b=document.createElement('button');b.textContent=a.title;b.className=key===current?'active':'';b.onclick=()=>show(key);nav.append(b)}const add=document.createElement('button');add.textContent='+ Add a space';add.setAttribute('aria-label','Add a personal life area');add.className='nav-add';add.onclick=addCustomArea;nav.append(add)}
async function addCustomArea(){const name=prompt('What would you like a space for? Examples: Baby, Health, Home, Relationships.');if(!name?.trim())return;try{const area=await api('/api/areas',{name:name.trim()});areas[area.id]={title:area.name,sub:'Your own space. Add whatever you want to keep track of.'};show(area.id)}catch(e){alert(e.message)}}
function setAreaAccent(key){const accents={home:'#9db7ff',thoughts:'#b8a1ff',dreams:'#a7a9ff',todos:'#a3e4bf',finances:'#edcf8c',journal:'#f1b3ca',files:'#8edbd2',computer:'#ffb784'};if(accents[key])document.body.style.removeProperty('--area-accent');else document.body.style.setProperty('--area-accent','#b8a1ff')}
function show(key){if(!areas[key])return;current=key;history.replaceState(null,'','?area='+encodeURIComponent(key));document.body.dataset.area=key;setAreaAccent(key);$('page-title').textContent=areas[key].title;$('page-subtitle').textContent=areas[key].sub;renderNav();renderPage().catch(e=>status('app-status',e.message,'error'))}
function status(id,text,kind=''){const e=$(id);if(e){e.textContent=text;e.className='status '+kind}}
function money(n){return new Intl.NumberFormat(undefined,{style:'currency',currency:'USD'}).format(Number(n)||0)}
function entryCard(x){const checked=x.completed?'checked':'';const done=x.completed?' done':'';const amount=x.amount!=null?`<div class="entry-meta">$${Number(x.amount).toFixed(2)}</div>`:'';const due=x.due_date?`<div class="entry-meta">Due ${esc(x.due_date)}</div>`:'';return `<article class="entry${done}"><div class="entry-top"><input aria-label="Mark ${esc(x.title)} complete" type="checkbox" ${checked} onchange="toggleEntry(${x.id},this.checked)"><div class="entry-text"><div class="entry-title">${esc(x.title)}</div>${x.content?`<div class="entry-body">${esc(x.content)}</div>`:''}${amount}${due}</div><button class="soft" onclick="removeEntry(${x.id})" aria-label="Delete ${esc(x.title)}">Delete</button></div></article>`}
function entryForm(area){const todo=area==='todos';return `<form class="card" id="entry-form"><h2>${todo?'Add a to-do':area==='dreams'?'Record a dream':area==='journal'?'Write a journal entry':'Capture a '+esc(areas[area]?.title?.toLowerCase()||'note')}</h2><div class="field"><label for="entry-title">${todo?'What needs doing?':'Title'}</label><input id="entry-title" maxlength="160" required placeholder="${todo?'A small next step':'A few words to find this later'}"></div><div class="field"><label for="entry-content">Details</label><textarea id="entry-content" maxlength="12000" placeholder="Add notes, questions, ideas, or context."></textarea></div>${todo?'<div class="field"><label for="entry-due">Due date (optional)</label><input type="date" id="entry-due"></div>':''}<button class="primary" type="submit">Save</button><div class="status" id="form-status" aria-live="polite"></div></form>`}
async function renderEntries(area,target){try{const items=await api('/api/entries/'+encodeURIComponent(area));const box=$(target);box.innerHTML=items.length?items.map(entryCard).join(''):'<div class="empty">Nothing here yet. Add an entry when you’re ready.</div>';if(area==='todos'){const open=items.filter(x=>!x.completed).length;if($('todo-count'))$('todo-count').textContent=open?`${open} open`:'All caught up'}}catch(e){$(target).textContent=e.message;$(target).className='status error'}}
function goalsPage(){return `<div class="grid"><form class="card" id="goal-form"><h2>Add a big goal</h2><div class="field"><label for="goal-title">Goal</label><input id="goal-title" required maxlength="160" placeholder="Make a plan for…"></div><div class="field"><label for="goal-description">Notes / why it matters</label><textarea id="goal-description" maxlength="4000" placeholder="What would success look like? What is the first question?"></textarea></div><div class="field"><label for="goal-priority">Priority</label><select id="goal-priority"><option value="1">High</option><option value="2" selected>Normal</option><option value="3">Later</option></select></div><button class="primary">Save goal</button><div id="goal-status" class="status" aria-live="polite"></div></form><section class="card"><h2>Your priorities</h2><p class="status">Highest-priority goals appear first on Home.</p><div id="goal-list" class="entry-list"></div></section></div>`}
async function renderGoals(target='goal-list'){try{const goals=await api('/api/goals'),box=$(target);if(!box)return;box.innerHTML=goals.length?goals.slice(0,target==='home-goals'?4:100).map(g=>`<article class="entry"><div class="entry-top"><div class="entry-text"><div class="entry-title">${esc(g.title)}</div><div class="entry-meta">${['','High priority','Normal priority','Later'][g.priority]}</div>${g.description?`<div class="entry-body">${esc(g.description)}</div>`:''}</div>${target==='goal-list'?`<button class="soft" onclick="deleteGoal(${g.id})">Remove</button>`:''}</div></article>`).join(''):'<div class="empty">Add a goal to keep it visible here.</div>'}catch(e){status('app-status','Could not load goals: '+e.message,'error')}}
function bindGoals(){renderGoals();$('goal-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/goals',{title:$('goal-title').value,description:$('goal-description').value,priority:$('goal-priority').value});e.currentTarget.reset();$('goal-priority').value='2';status('goal-status','Goal saved on this PC.','good');await renderGoals()}catch(err){status('goal-status',err.message,'error')}}}
async function deleteGoal(id){if(!confirm('Remove this goal from Phillap?'))return;try{await api('/api/goals/delete',{id});await renderGoals()}catch(e){status('goal-status',e.message,'error')}}
function financePage(){return `<div class="grid"><section class="card wide"><h2>Your monthly picture</h2><p class="status">Recurring income minus recurring bills. One-time items are listed separately. Numbers are estimates from what you enter, not bank data or financial advice.</p><div class="money-summary-grid"><div class="money-tile income"><small>Coming in / month</small><strong id="month-income">—</strong></div><div class="money-tile expense"><small>Bills &amp; costs / month</small><strong id="month-expenses">—</strong></div><div class="money-tile remaining"><small>Left after listed costs</small><strong id="month-remaining">—</strong></div></div><div class="status">This only includes items you add. It does not yet account for taxes, irregular spending, savings, or debts unless you enter them.</div></section><form class="card" id="finance-form"><h2>Add income or a bill</h2><div class="field"><label for="finance-direction">Money</label><select id="finance-direction"><option value="income">Coming in (+)</option><option value="expense">Going out (−)</option></select></div><div class="field"><label for="finance-title">What is it?</label><input id="finance-title" required maxlength="120" placeholder="Paycheck, rent, power bill…"></div><div class="field"><label for="finance-amount">Amount (USD)</label><input id="finance-amount" type="number" min="0.01" step="0.01" required placeholder="0.00"></div><div class="field"><label for="finance-frequency">How often?</label><select id="finance-frequency"><option value="weekly">Weekly</option><option value="biweekly">Every 2 weeks</option><option value="monthly" selected>Monthly</option><option value="quarterly">Every 3 months</option><option value="yearly">Once a year</option><option value="once">One-time</option></select></div><div class="field"><label for="finance-due">Bill due day of month (optional)</label><input id="finance-due" type="number" min="1" max="31" placeholder="e.g. 15"></div><div class="field"><label for="finance-person">Who is this for?</label><input id="finance-person" maxlength="60" value="Me" placeholder="Me, Partner, Baby, Household…"></div><div class="field"><label for="finance-category">Category (optional)</label><input id="finance-category" maxlength="60" placeholder="Housing, utilities, childcare…"></div><button class="primary" type="submit">Add to monthly picture</button><div id="finance-status" class="status" aria-live="polite"></div></form><section class="card"><div class="row"><h2>Income &amp; bills</h2><button id="finance-refresh" class="soft">Refresh</button></div><div id="finance-list" class="entry-list"></div></section><section class="card wide"><div class="privacy"><b>Household-ready, not shared yet.</b> You can label items Me, Partner, Baby, or Household. They stay on this PC for now. A second person's sign-in, permissions, and safe shared sync still need to be built before inviting your girlfriend.</div></section></div>`}
async function renderFinances(){try{const data=await api('/api/finances');$('month-income').textContent=money(data.monthly_income);$('month-expenses').textContent='−'+money(data.monthly_expenses);const remaining=$('month-remaining');remaining.textContent=(data.monthly_remaining<0?'−':'')+money(Math.abs(data.monthly_remaining));remaining.className=data.monthly_remaining<0?'negative':'';const list=$('finance-list');list.innerHTML=data.items.length?data.items.map(item=>`<article class="entry"><div class="entry-top"><div class="entry-text"><div class="entry-title">${item.direction==='income'?'+':'−'} ${esc(item.title)} <span class="money-value ${item.direction}">${money(item.amount)}</span></div><div class="entry-meta">${esc(item.frequency)} · ${esc(item.household_member)}${item.due_day?' · due day '+item.due_day:''}${item.category?' · '+esc(item.category):''}</div>${item.frequency==='once'?'<div class="entry-meta">Not included in monthly recurring total</div>':''}</div><button class="soft" onclick="deleteFinance(${item.id})">Remove</button></div></article>`).join(''):'<div class="empty">Add the income and bills you know to see an estimate.</div>'}catch(e){status('finance-status',e.message,'error')}}
function bindFinances(){renderFinances();$('finance-refresh').onclick=renderFinances;$('finance-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/finance',{direction:$('finance-direction').value,title:$('finance-title').value,amount:$('finance-amount').value,frequency:$('finance-frequency').value,due_day:$('finance-due').value,household_member:$('finance-person').value||'Me',category:$('finance-category').value});$('finance-form').reset();$('finance-person').value='Me';$('finance-frequency').value='monthly';status('finance-status','Saved locally. Your monthly picture is updated.','good');await renderFinances()}catch(err){status('finance-status',err.message,'error')}}}
async function deleteFinance(id){if(!confirm('Remove this income or bill from the local monthly picture?'))return;try{await api('/api/finance/delete',{id});await renderFinances()}catch(e){status('finance-status',e.message,'error')}}
function projectPage(){return `<div class="grid"><form class="card wide" id="project-form"><h2>Start with the idea</h2><div class="field"><label for="project-title">What are you hoping to do?</label><input id="project-title" required maxlength="120" placeholder="Build a 40-foot fence"></div><div class="field"><label for="project-notes">What should Phillap know?</label><textarea id="project-notes" placeholder="Style, purpose, budget, who is helping, questions, or anything you’re unsure about."></textarea></div><div class="planner-fields"><div class="field"><label for="fence-length">Fence length (feet)</label><input id="fence-length" type="number" min="1" max="10000" value="40"></div><div class="field"><label for="fence-height">Height (feet)</label><input id="fence-height" type="number" min="1" max="20" value="6"></div><div class="field"><label for="fence-spacing">Post spacing (feet)</label><input id="fence-spacing" type="number" min="4" max="12" value="8"></div><div class="field"><label for="fence-style">Fence style</label><select id="fence-style"><option value="picket">Picket / board-on-board</option><option value="privacy">Privacy panels</option><option value="chain">Chain link (materials need local sizing)</option></select></div><div class="field"><label for="fence-board-width">Board width (inches, if using boards)</label><input id="fence-board-width" type="number" min="1" max="24" step="0.25" value="5.5"></div><div class="field"><label for="fence-gap">Gap between boards (inches)</label><input id="fence-gap" type="number" min="0" max="12" step="0.25" value="0.5"></div><div class="field"><label for="fence-gates">Number of gates</label><input id="fence-gates" type="number" min="0" max="20" value="1"></div><div class="field"><label for="fence-zip">Material-price area ZIP/postal code</label><input id="fence-zip" value="97322" maxlength="12"></div></div><p class="status">First-pass quantities only, not a structural design. You’ll review every assumption. Unit prices start blank/$0 so Phillap doesn’t invent current local prices; add a store quote and link to get a real estimate.</p><button class="primary" type="submit">Create plan &amp; checklist</button><div id="project-status" class="status" aria-live="polite"></div></form><section class="card wide"><h2>Your plans</h2><div id="project-list" class="entry-list"></div></section></div>`}
async function renderProjects(){try{const projects=await api('/api/projects'),box=$('project-list');if(!box)return;box.innerHTML=projects.length?projects.map(p=>`<article class="entry project-card"><div class="row"><div><div class="entry-title">${esc(p.title)}</div><div class="entry-meta">Planning · ${esc(p.location_zip)} · material estimate ${money(p.estimate)}</div></div><button class="soft" onclick="deleteProject(${p.id})">Remove</button></div>${p.description?`<p class="entry-body">${esc(p.description)}</p>`:''}<h3>Project checklist</h3><div class="entry-list">${p.steps.map(step=>`<label class="project-step ${step.completed?'done':''}"><input type="checkbox" ${step.completed?'checked':''} onchange="toggleProjectStep(${step.id},this.checked)"><span>${esc(step.title)}</span></label>`).join('')}</div><form class="row step-form" onsubmit="return addProjectStep(event,${p.id})"><input name="title" required maxlength="200" placeholder="Add a project step…"><button class="soft">Add step</button></form><h3>Materials &amp; price notes</h3><p class="status">Calculated quantities are rough. Enter a current local unit price and source/URL; estimates update automatically.</p>${p.materials.map(m=>`<div class="material-row"><div><b>${esc(m.name)}</b><small>${Number(m.quantity).toLocaleString()} ${esc(m.unit)} · subtotal ${money(m.subtotal)}</small><form class="material-price" onsubmit="return saveMaterialPrice(event,${m.id})"><input name="price" type="number" min="0" step="0.01" value="${Number(m.unit_price).toFixed(2)}" aria-label="Unit price for ${esc(m.name)}"><input name="source" value="${esc(m.source)}" maxlength="300" placeholder="Store / quote link"><button class="soft">Save price</button></form></div><button class="soft" onclick="deleteMaterial(${m.id})">Remove</button></div>`).join('')}<form class="material-form" onsubmit="return addMaterial(event,${p.id})"><h4>Add another material</h4><input name="name" required placeholder="Material"><input name="quantity" type="number" min="0.01" step="0.01" required placeholder="Quantity"><input name="unit" value="each" required placeholder="Unit"><input name="price" type="number" min="0" step="0.01" value="0.00" placeholder="Unit price"><input name="source" placeholder="Price source / link"><button class="primary">Add material</button></form><strong class="project-total">Current materials estimate: ${money(p.estimate)}</strong><div class="status">No tax, delivery, tools, waste allowance, labor, or permit fees included. Check local rules and utility markings before digging.</div></article>`).join(''):'<div class="empty">Your ideas and plans will show up here. Start with one small project above.</div>'}catch(e){status('project-status',e.message,'error')}}
async function bindProjects(){$('project-form').onsubmit=async e=>{e.preventDefault();try{const len=Number($('fence-length').value),height=Number($('fence-height').value),spacing=Number($('fence-spacing').value),gates=Number($('fence-gates').value),width=Number($('fence-board-width').value),gap=Number($('fence-gap').value),style=$('fence-style').value;if(!(len>0&&height>0&&spacing>0&&gates>=0))throw Error('Check the project dimensions.');const project=await api('/api/projects',{title:$('project-title').value,description:$('project-notes').value||`${style} fence, approximately ${len} ft long and ${height} ft high. First-pass plan; confirm site, gates, grade, and local code before buying.`,location_zip:$('fence-zip').value});const spans=Math.ceil(len/spacing),posts=spans+1+gates*2,materials=[{name:'Fence posts (spacing-based estimate)',quantity:posts,unit:'each'},{name:'Gate openings / gate units (verify width & hardware)',quantity:gates,unit:'each'},{name:'Concrete bags (planning allowance: 2 per post; verify product/post spec)',quantity:posts*2,unit:'50-lb bags'}];if(style==='chain'){materials.push({name:'Chain-link fabric',quantity:len,unit:'linear ft — verify height & roll size'},{name:'Rails, tension bars, and fittings (confirm layout)',quantity:1,unit:'set — supplier quote needed'})}else if(style==='privacy'){materials.push({name:'Privacy fence panels',quantity:spans,unit:'panels — verify panel width'},{name:'Rails (planning allowance: 3 per span)',quantity:spans*3,unit:'each'})}else{const boardCount=Math.ceil(Math.max(0,len*12-gates*36)/(width+gap));materials.push({name:'Fence rails (planning allowance: 3 per span)',quantity:spans*3,unit:'each'},{name:'Fence boards / pickets (width + gap assumption)',quantity:boardCount,unit:'each'})}const steps=['Confirm property line, fence ownership, and local setback/permit rules','Contact 811 and wait for underground utility marking before digging','Confirm final fence style, height, gate widths, slope, and exact layout','Get current local quotes for lumber, posts, concrete, gates, and hardware','Recheck material quantities against the chosen products and site measurements','Set posts to product guidance; check alignment and allow concrete to cure','Install rails, panels, boards, gates, and hardware','Walk the completed fence and keep receipts/warranty details'];for(const item of materials)await api('/api/projects/material',{project_id:project.id,...item,unit_price:0,source:''});for(const title of steps)await api('/api/projects/step',{project_id:project.id,title});status('project-status','Plan created with editable assumptions. No live store price has been invented.','good');$('project-form').reset();$('fence-length').value='40';$('fence-height').value='6';$('fence-spacing').value='8';$('fence-gates').value='1';$('fence-board-width').value='5.5';$('fence-gap').value='0.5';$('fence-zip').value='97322';await renderProjects()}catch(err){status('project-status',err.message,'error')}};await renderProjects()}

function filePanel(){return `<section class="card wide"><div class="row"><div><h2>Your files</h2><p class="status">Files stay on this PC. Supported: PDF, Word (.docx), text, Markdown, CSV, and code/config files. Up to 10 MB each.</p></div><button class="soft" onclick="show('files')">Open library</button></div><div class="drop-zone" id="drop-zone"><div class="field" style="max-width:360px;margin:0 auto 12px;text-align:left"><label for="file-importance">File importance</label><select id="file-importance"><option value="">Choose before upload…</option><option value="critical">Critical — keep until I delete it</option><option value="non-critical">Non-critical — warn after 10 days; never delete automatically</option></select></div><strong>Drop files here</strong><br><span class="status">or choose files from this PC</span><br><button type="button" class="primary" id="choose-files">Add files</button><input class="hidden" id="file-input" type="file" multiple accept=".pdf,.docx,.md,.txt,.rst,.py,.js,.ts,.tsx,.json,.yaml,.yml,.toml,.html,.css,.csv,.xml,.ini"></div><div id="file-status" class="status" aria-live="polite"></div><div class="entry-list" id="file-list"></div><section id="file-editor" class="file-editor hidden" style="margin-top:18px"><h2 id="edit-title">Edit a copy</h2><p class="status">Saving creates a new local file. The original stays unchanged.</p><textarea id="edit-content" aria-label="Edited copy contents"></textarea><div class="row" style="margin-top:8px"><button type="button" class="primary" id="save-edited">Save separate copy</button><button type="button" class="soft" id="cancel-edit">Cancel</button></div><div id="edit-status" class="status" aria-live="polite"></div></section></section>`}
function bindFilePicker(){const picker=$('file-input'),drop=$('drop-zone');if(!picker||!drop)return;$('choose-files').onclick=()=>picker.click();picker.onchange=()=>{uploadFiles([...picker.files]);picker.value=''};for(const event of ['dragenter','dragover'])drop.addEventListener(event,e=>{e.preventDefault();drop.classList.add('drag')});for(const event of ['dragleave','drop'])drop.addEventListener(event,e=>{e.preventDefault();drop.classList.remove('drag')});drop.addEventListener('drop',e=>uploadFiles([...e.dataTransfer.files]))}
async function uploadFiles(files){if(!files.length)return;const importance=$('file-importance')?.value;if(!importance){status('file-status','Choose Critical or Non-critical before uploading.','error');return}for(const file of files){if(file.size>10*1024*1024){status('file-status',file.name+' is over the 10 MB limit.','error');continue}status('file-status','Adding '+file.name+'…');try{const content=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=()=>reject(Error('Could not read '+file.name));reader.readAsDataURL(file)});await api('/api/files',{name:file.name,content,importance});status('file-status',file.name+' added as '+importance+'. It stays on this PC.','good');await renderFileList()}catch(e){status('file-status',e.message,'error')}}$('file-importance').value=''}
async function renderFileList(){try{const files=await api('/api/files'),box=$('file-list');if(!box)return;box.replaceChildren();const soon=files.filter(f=>f.importance==='non-critical'&&!f.retained&&f.expires_at&&new Date(f.expires_at.replace(' ','T')+'Z').getTime()<=Date.now()+2*86400000);if(soon.length)status('file-status',`${soon.length} non-critical file(s) are due for review within 2 days. Choose Keep or Remove; Phillap will not delete them automatically.`,'error');if(!files.length){box.innerHTML='<div class="empty">No files yet. Add something you want to keep handy.</div>';return}for(const file of files){const row=document.createElement('div');row.className='file-row';const info=document.createElement('div');const name=document.createElement('div');name.className='file-name';name.textContent=file.name;const meta=document.createElement('div');meta.className='file-meta';meta.textContent=(file.size/1024).toFixed(0)+' KB · '+(file.supported?'available to document search':'stored locally; not searchable')+' · '+(file.importance==='critical'?'Critical — kept until you delete it':file.retained?'Non-critical — kept by your choice':file.expires_at?('Non-critical — review by '+new Date(file.expires_at.replace(' ','T')+'Z').toLocaleDateString()):'Non-critical — awaiting your choice; never deleted automatically');info.append(name,meta);const actions=document.createElement('div');actions.className='file-actions';const download=document.createElement('a');download.className='soft';download.href='/api/files/'+encodeURIComponent(file.id)+'/download';download.download=file.name;download.textContent='Download';download.style.textDecoration='none';download.style.padding='5px 8px';download.style.border='1px solid var(--line)';download.style.borderRadius='8px';actions.append(download);if(file.importance==='non-critical'&&!file.retained){const keep=document.createElement('button');keep.className='soft';keep.textContent='Keep';keep.setAttribute('aria-label','Keep '+file.name);keep.onclick=async()=>{try{await api('/api/files/retain',{id:file.id});await renderFileList()}catch(e){status('file-status',e.message,'error')}};actions.append(keep)}if(file.supported){const edit=document.createElement('button');edit.className='soft';edit.textContent='Edit copy';edit.onclick=()=>editUploadedFile(file.id);actions.append(edit)}const del=document.createElement('button');del.className='soft';del.textContent='Remove';del.onclick=()=>deleteFile(file.id,file.name);actions.append(del);row.append(info,actions);box.append(row)}}catch(e){status('file-status',e.message,'error')}}
async function editUploadedFile(id){try{const source=await api('/api/files/'+id+'/content');$('edit-title').textContent='Edit a copy of '+source.name;$('edit-content').value=source.content;$('file-editor').classList.remove('hidden');$('edit-status').textContent=source.format==='.pdf'||source.format==='.docx'?'Saving creates an editable Markdown text copy; download it and open it in your synced folder if needed. The original is untouched.':'Saving creates another file copy. Download the copy to put it in a synced folder; the uploaded original is untouched.';$('save-edited').onclick=async()=>{if(!confirm('Save your edited text as a separate new file? The source file will not be changed.'))return;$('save-edited').disabled=true;try{const copy=await api('/api/files/edit',{id,content:$('edit-content').value});$('edit-status').textContent='Saved '+copy.name+' as a separate copy. The original is unchanged.';$('edit-status').className='status good';await renderFileList()}catch(e){$('edit-status').textContent=e.message;$('edit-status').className='status error'}finally{$('save-edited').disabled=false}};$('cancel-edit').onclick=()=>{$('file-editor').classList.add('hidden');$('edit-content').value=''};$('file-editor').scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){status('file-status',e.message,'error')}}
async function deleteFile(id,name){if(!confirm('Remove '+name+' from Phillap on this PC?'))return;try{await api('/api/files/delete',{id});status('file-status',name+' removed.','good');await renderFileList()}catch(e){status('file-status',e.message,'error')}}
function browserPage(){return `<div class="grid"><section class="card wide"><h2>Websites &amp; AI tools</h2><p class="status">These open in your regular browser so you can sign in to your own accounts. Phillap does not read passwords or website pages. Google Voice calls are made by you in Google Voice; Phillap does not place calls.</p><div class="chips"><a class="chip" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT</a><a class="chip" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Google Gemini</a><a class="chip" href="https://claude.ai/" target="_blank" rel="noopener noreferrer">Claude</a><a class="chip" href="https://docs.google.com/" target="_blank" rel="noopener noreferrer">Google Docs</a><a class="chip" href="https://voice.google.com/" target="_blank" rel="noopener noreferrer">Google Voice</a><a class="chip" href="https://www.google.com/" target="_blank" rel="noopener noreferrer">Google Search</a></div></section><section class="card"><h2>My bookmarks</h2><div id="bookmark-list" class="chips"></div><form id="bookmark-form" style="margin-top:12px"><div class="field"><label for="bookmark-name">Bookmark name</label><input id="bookmark-name" maxlength="60" required placeholder="My website"></div><div class="field"><label for="bookmark-url">Website address</label><input id="bookmark-url" type="url" required placeholder="https://example.com"></div><button class="soft">Save bookmark</button><div id="bookmark-status" class="status" aria-live="polite"></div></form></section><form class="card" id="web-open-form"><h2>Open a website</h2><div class="field"><label for="web-url">Website address</label><input id="web-url" type="url" placeholder="https://example.com" required></div><button class="primary">Open in browser</button><div id="web-status" class="status" aria-live="polite"></div></form><form class="card" id="web-search-form"><h2>Search the web</h2><p class="status">Opens Google Search for you. To ask Phillap about a page, paste the relevant text and its link in Assistant.</p><div class="field"><label for="web-query">Search terms</label><input id="web-query" required placeholder="Find local fence prices…"></div><button class="soft">Search in browser</button></form><section class="card wide"><div class="privacy">The website opens outside Phillap using your normal browser profile. Sign-in and permissions belong to the website. Cloud AI services may charge or have changing free plans; Phillap does not send your files to them.</div></section></div>`}
function safeWebUrl(value){const url=new URL(value);if(!['http:','https:'].includes(url.protocol)||url.username||url.password)throw Error('Use a public http or https address without embedded credentials.');return url.href}
function renderBookmarks(){const box=$('bookmark-list');if(!box)return;box.replaceChildren();let saved=[];try{saved=JSON.parse(localStorage.getItem('phillap-bookmarks')||'[]')}catch(e){status('bookmark-status','Saved bookmarks could not be read.','error');return}if(!Array.isArray(saved))saved=[];for(const [index,item]of saved.entries()){try{const url=safeWebUrl(item.url);const a=document.createElement('a');a.className='chip';a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=item.name+' ↗';box.append(a);const remove=document.createElement('button');remove.type='button';remove.className='soft';remove.textContent='Remove '+item.name;remove.onclick=()=>{saved.splice(index,1);localStorage.setItem('phillap-bookmarks',JSON.stringify(saved));renderBookmarks()};box.append(remove)}catch(e){}}if(!box.children.length)box.textContent='No saved bookmarks yet.'}
function bindBrowser(){renderBookmarks();const open=form=>safeWebUrl(form);$('web-open-form').onsubmit=e=>{e.preventDefault();try{const url=open($('web-url').value.trim());window.open(url,'_blank','noopener,noreferrer');status('web-status','Opened in your regular browser.','good')}catch(err){status('web-status',err.message,'error')}};$('bookmark-form').onsubmit=e=>{e.preventDefault();try{const name=$('bookmark-name').value.trim(),url=safeWebUrl($('bookmark-url').value.trim());if(!name||name.length>60)throw Error('Enter a bookmark name up to 60 characters.');const saved=JSON.parse(localStorage.getItem('phillap-bookmarks')||'[]');if(!Array.isArray(saved)||saved.length>=50)throw Error('You can save up to 50 bookmarks.');saved.push({name,url});localStorage.setItem('phillap-bookmarks',JSON.stringify(saved));e.currentTarget.reset();status('bookmark-status','Bookmark saved in this browser.','good');renderBookmarks()}catch(err){status('bookmark-status',err.message,'error')}};$('web-search-form').onsubmit=e=>{e.preventDefault();const query=$('web-query').value.trim();if(query)window.open('https://www.google.com/search?q='+encodeURIComponent(query),'_blank','noopener,noreferrer')}}
function assistantPage(){return `<section class="card"><h2>Ask Phillap</h2><div class="privacy">Answers run through Ollama on this PC. Phillap searches the files you upload and the documents folder you configured. It does not automatically send your private To-do, Dream, Finance, Thought, or Journal entries to the model.</div><details style="margin-top:12px"><summary>Ask about a web page (paste text you chose)</summary><p class="status">Phillap cannot read pages in your browser directly. Paste only passages you want the local assistant to use.</p><div class="field"><label for="web-source">Page link or source name</label><input id="web-source" maxlength="500" placeholder="https://example.com/article"></div><div class="field"><label for="web-excerpt">Selected page text</label><textarea id="web-excerpt" maxlength="12000" placeholder="Paste relevant text here…"></textarea></div></details><div class="row" style="margin:14px 0"><select id="conversation-picker" aria-label="Saved conversations"><option value="">New conversation</option></select><button id="new-conversation" class="soft" type="button">New chat</button></div><div id="messages" class="messages" style="height:48vh;min-height:250px;margin:14px 0"></div><div class="row"><textarea id="question" placeholder="Ask about a document…" aria-label="Message"></textarea><button class="primary" id="send">Ask</button></div><div id="chat-status" class="status" aria-live="polite">Your local model is ready when Ollama is running.</div></section>`}
async function bindAssistant(){const send=$('send');if(!send)return;let conversationId=null;const refreshConversations=async selected=>{const items=await api('/api/conversations'),picker=$('conversation-picker');picker.replaceChildren(new Option('New conversation',''));for(const item of items)picker.add(new Option(item.title+' · '+item.updated_at,item.id));picker.value=selected?String(selected):''};const loadConversation=async id=>{const box=$('messages');box.replaceChildren();conversationId=id?Number(id):null;if(!conversationId)return;const data=await api('/api/conversations/'+conversationId);for(const item of data.messages)addMessage(item.role,item.content,item.sources)};try{await refreshConversations(null)}catch(e){status('chat-status','Could not load saved chats: '+e.message,'error')}$('conversation-picker').onchange=async e=>{try{await loadConversation(e.target.value);status('chat-status','Saved conversation loaded on this PC.','good')}catch(err){status('chat-status',err.message,'error')}};$('new-conversation').onclick=()=>{conversationId=null;$('conversation-picker').value='';$('messages').replaceChildren();status('chat-status','New conversation. Your next question will be saved on this PC.','good')};const submit=async()=>{const question=$('question').value.trim();if(!question)return;addMessage('user',question);$('question').value='';send.disabled=true;status('chat-status','Thinking on this PC…');try{const answer=await api('/api/chat',{question,conversation_id:conversationId,web_excerpt:$('web-excerpt')?.value||'',web_source:$('web-source')?.value||''});conversationId=answer.conversation_id;addMessage('assistant',answer.answer,answer.sources);await refreshConversations(conversationId);status('chat-status','Saved on this PC.')}catch(e){status('chat-status',e.message,'error')}finally{send.disabled=false;$('question').focus()}};send.onclick=submit;$('question').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}})}
function computerPage(){return `<div class="grid"><section class="card wide"><h2>Open a file or app</h2><p class="status">Type a full Windows path. Phillap will ask you to confirm the exact path before opening it.</p><div class="field"><label for="open-path">File or application path</label><div class="row"><input id="open-path" placeholder="C:\\Users\\you\\Documents\\notes.txt"><button type="button" class="soft" id="browse-file">Browse…</button></div></div><button class="primary" id="open-action">Review and open</button><div class="status" id="open-status" aria-live="polite"></div></section><section class="card"><h2>Download a file</h2><p class="status">Downloads use HTTPS, are limited to 50 MB, and save in your Downloads\Phillap folder. Redirects and local-network addresses are blocked.</p><div class="field"><label for="download-url">Direct HTTPS download link</label><input id="download-url" type="url" placeholder="https://example.com/file.pdf"></div><button class="primary" id="download-action">Review and download</button><div class="status" id="download-status" aria-live="polite"></div></section><section class="card"><h2>Organize copies of files</h2><p class="status">Choose a folder path. Phillap previews a plan, then copies files into “Phillap Organized” subfolders. Originals are never moved or deleted.</p><div class="field"><label for="organize-path">Folder path</label><div class="row"><input id="organize-path" placeholder="C:\\Users\\you\\Downloads"><button type="button" class="soft" id="browse-folder">Browse…</button></div></div><button class="primary" id="plan-action">Preview copy plan</button><div id="plan-status" class="status" aria-live="polite"></div><div id="plan-list" class="entry-list"></div><button class="soft hidden" id="apply-plan">Confirm and copy these files</button></section><section class="card"><h2>Safety boundaries</h2><div class="privacy">Phillap does not run arbitrary shell commands or follow AI instructions to operate Windows. You choose each path and approve each action. Keep sensitive files out of folders you choose to upload or organize.</div></section></div>`}
function bindComputer(){const opener=$('open-action');if(!opener)return;$('browse-file').onclick=async()=>{try{const chosen=await api('/api/computer/pick-file',{});if(chosen.path)$('open-path').value=chosen.path}catch(e){status('open-status',e.message,'error')}};$('browse-folder').onclick=async()=>{try{const chosen=await api('/api/computer/pick-folder',{});if(chosen.path)$('organize-path').value=chosen.path}catch(e){status('plan-status',e.message,'error')}};opener.onclick=async()=>{const path=$('open-path').value.trim();if(!path)return status('open-status','Enter a file or application path.','error');if(!confirm(`Open this exact item on your computer?\n\n${path}`))return;try{const result=await api('/api/computer/open',{path});status('open-status','Opened '+result.opened,'good')}catch(e){status('open-status',e.message,'error')}};$('download-action').onclick=async()=>{const url=$('download-url').value.trim();if(!url)return status('download-status','Enter a direct HTTPS download link.','error');if(!confirm(`Download this file to your Downloads\\Phillap folder?\n\n${url}\n\nOnly download files from a source you trust.`))return;status('download-status','Downloading…');try{const result=await api('/api/computer/download',{url});status('download-status',`Saved ${result.name} to ${result.path} (${(result.size/1024).toFixed(0)} KB).`,'good')}catch(e){status('download-status',e.message,'error')}};$('plan-action').onclick=async()=>{const folder=$('organize-path').value.trim();if(!folder)return status('plan-status','Enter a folder path first.','error');try{const plan=await api('/api/computer/organize-preview',{folder}),list=$('plan-list');list.replaceChildren();$('apply-plan').classList.add('hidden');if(!plan.files.length){status('plan-status','No new files to copy. The originals are unchanged.','good');return}for(const item of plan.files){const row=document.createElement('div');row.className='file-row';const label=document.createElement('div');label.textContent=`${item.name} → ${item.category}`;row.append(label);list.append(row)}status('plan-status',`${plan.files.length} files will be copied to ${plan.output}. Original files will stay untouched.`);$('apply-plan').classList.remove('hidden');$('apply-plan').onclick=async()=>{if(!confirm(`Copy ${plan.files.length} files into:\n${plan.output}?\n\nNo originals will be moved or deleted.`))return;$('apply-plan').disabled=true;try{const result=await api('/api/computer/organize',{folder,files:plan.files});status('plan-status',`Copied ${result.copied} files into ${result.output}. Originals are unchanged.`,'good');$('apply-plan').classList.add('hidden');list.replaceChildren()}catch(e){status('plan-status',e.message,'error')}finally{$('apply-plan').disabled=false}}}catch(e){status('plan-status',e.message,'error')}}}
function summaryCard(area,title,target){return `<section class="card"><div class="row"><h2>${title}</h2>${area==='todos'?'<span id="todo-count" class="status"></span>':''}<button class="soft" onclick="show('${area}')">Open</button></div><div class="entry-list" id="${target}"></div></section>`}
async function renderHome(){ $('page').innerHTML=`<div class="grid"><section class="card wide"><p class="welcome">You do not have to figure it all out at once. Add what is on your mind; we can turn it into manageable steps.</p><div class="quick"><button onclick="show('todos')"><strong>To-dos</strong><small>Pick one next step</small></button><button onclick="show('thoughts')"><strong>Thoughts</strong><small>Clear some headspace</small></button><button onclick="show('finances')"><strong>Money</strong><small>Income minus bills</small></button><button onclick="show('projects')"><strong>Plan something</strong><small>Build it one step at a time</small></button><button onclick="show('journal')"><strong>Journal</strong><small>Write about today</small></button><button onclick="show('assistant')"><strong>Ask Phillap</strong><small>Get help with chosen files</small></button></div></section>${summaryCard('todos','Next to-dos','home-todos')}${summaryCard('thoughts','Recent thoughts','home-thoughts')}<section class="card"><h2>Monthly picture</h2><p class="status">Estimate from bills and income you add.</p><div class="money-summary" id="home-remaining">—</div><button class="soft" onclick="show('finances')">Open money</button></section><section class="card"><div class="row"><h2>Big goals</h2><button class="soft" onclick="show('goals')">Manage</button></div><div id="home-goals" class="entry-list"></div></section><section class="card"><h2>Plans &amp; projects</h2><p class="status">Turn an idea into a checklist and material estimate.</p><button class="soft" onclick="show('projects')">Open plans</button></section>${filePanel()}<section class="card"><h2>Dreams</h2><p class="status">Keep a record of what you remember. No interpretation required.</p><button onclick="show('dreams')">Open dreams</button></section><section class="card"><h2>Build your own spaces</h2><p class="status">Add a subject for anything in life: Baby, Health, Home, Relationships, or whatever matters to you.</p><button class="soft" onclick="addCustomArea()">+ Add a space</button></section><section class="card wide"><div class="privacy">Private by default: life notes, money, and family labels stay on this PC. Partner sign-in and safe shared access are not implemented yet.</div></section><section class="card wide"><h2>Use your computer</h2><p class="status">Open a file, download a trusted link, or preview copies into folders.</p><button class="primary" onclick="show('computer')">Open computer tools</button></section></div>`;await renderEntries('todos','home-todos');await renderEntries('thoughts','home-thoughts');await renderGoals('home-goals');try{const moneyData=await api('/api/finances');$('home-remaining').textContent=(moneyData.monthly_remaining<0?'−':'')+money(Math.abs(moneyData.monthly_remaining))}catch(e){status('app-status','Could not load the monthly picture: '+e.message,'error')}bindFilePicker();await renderFileList()}
async function renderPage(){if(current==='home'){await renderHome();return}if(current==='finances'){$('page').innerHTML=financePage();bindFinances();return}if(current==='goals'){$('page').innerHTML=goalsPage();bindGoals();return}if(current==='projects'){$('page').innerHTML=projectPage();await bindProjects();return}if(current==='computer'){$('page').innerHTML=computerPage();bindComputer();return}if(current==='browser'){$('page').innerHTML=browserPage();bindBrowser();return}if(current==='assistant'){$('page').innerHTML=assistantPage();bindAssistant();return}if(current==='files'){$('page').innerHTML=`<div class="grid">${filePanel()}<section class="card wide"><h2>How file search works</h2><div class="privacy">Uploaded files stay in this PC’s Phillap folder. When you ask the local assistant a question, matching text excerpts from supported files are sent to Ollama running on this PC. Scanned-image PDFs need OCR and are not searchable in this version.</div></section></div>`;bindFilePicker();await renderFileList();return}const listId='area-list';$('page').innerHTML=current.startsWith('topic-')?customAreaPage(current):`<div class="grid">${entryForm(current)}<section class="card"><div class="row"><h2>Your ${esc(areas[current]?.title?.toLowerCase()||'notes')}</h2><button class="soft" id="refresh">Refresh</button></div><div class="entry-list" id="${listId}"></div></section></div>`;await renderEntries(current,listId);const form=$('entry-form');if(form)form.onsubmit=async e=>{e.preventDefault();const data={area:current,title:$('entry-title').value,content:$('entry-content').value};if(current==='todos')data.due_date=$('entry-due').value;try{await api('/api/entries',data);form.reset();status('form-status','Saved on this PC.','good');await renderEntries(current,listId)}catch(err){status('form-status',err.message,'error')}};if($('refresh'))$('refresh').onclick=()=>renderEntries(current,listId)}
async function toggleEntry(id,completed){try{await api('/api/entries/toggle',{id,completed});await renderPage()}catch(e){alert(e.message)}}async function removeEntry(id){if(!confirm('Delete this entry from this PC?'))return;try{await api('/api/entries/delete',{id});await renderPage()}catch(e){alert(e.message)}}
function addMessage(role,text,sources=[]){const box=document.createElement('div');box.className='message '+role;const body=document.createElement('div');body.textContent=text;box.append(body);if(sources.length){const note=document.createElement('small');note.textContent='Sources: '+sources.join(', ');box.append(note)}if(role==='assistant'){const speak=document.createElement('button');speak.type='button';speak.className='soft';speak.textContent='Read aloud';speak.onclick=()=>{if(!('speechSynthesis'in window)){status('chat-status','Read-aloud is unavailable in this browser.','error');return}speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text))};box.append(speak)}$('messages').append(box);$('messages').scrollTop=$('messages').scrollHeight}
$('today').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(new Date());document.body.dataset.area=current;const themes=['forest','moonlit','golden','moss','stone'];const savedTheme=localStorage.getItem('phillap-theme');const selected=themes.includes(savedTheme)?savedTheme:'forest';document.body.dataset.theme=selected;$('theme-select').value=selected;$('theme-select').onchange=()=>{document.body.dataset.theme=$('theme-select').value;localStorage.setItem('phillap-theme',$('theme-select').value)};const setting=(key,fallback)=>localStorage.getItem('phillap-'+key)||fallback;const font=setting('font','georgia'),size=setting('size','large'),contrast=setting('contrast','off');document.body.dataset.font=font;$('font-select').value=font;document.body.dataset.size=size;$('text-size').value=size;document.body.dataset.contrast=contrast;$('high-contrast').checked=contrast==='high';$('font-select').onchange=()=>{document.body.dataset.font=$('font-select').value;localStorage.setItem('phillap-font',$('font-select').value)};$('text-size').onchange=()=>{document.body.dataset.size=$('text-size').value;localStorage.setItem('phillap-size',$('text-size').value)};$('high-contrast').onchange=()=>{document.body.dataset.contrast=$('high-contrast').checked?'high':'off';localStorage.setItem('phillap-contrast',document.body.dataset.contrast)};(async()=>{try{const saved=await api('/api/areas');for(const [id,name]of Object.entries(saved)){if(!areas[id])areas[id]={title:name,sub:'Your own space. Add whatever you want to keep track of.'}}if(!areas[current])current='home';document.body.dataset.area=current;setAreaAccent(current);$('page-title').textContent=areas[current].title;$('page-subtitle').textContent=areas[current].sub;await renderNav();await renderPage()}catch(e){status('app-status','Phillap could not load its local data: '+e.message,'error');await renderNav();await renderPage().catch(err=>status('app-status',err.message,'error'))}})();
</script></body></html>
